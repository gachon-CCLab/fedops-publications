<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.summary | default: site.description | escape }}" />
    <title>{{ page.title | default: site.title | escape }} | FedOps</title>
    <link rel="icon" href="{{ '/assets/fedops_icon.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ site.home_url }}" aria-label="FedOps home">
          <img src="{{ '/assets/fedops_icon.png' | relative_url }}" alt="" />
          <span>FedOps</span>
        </a>
        <span class="badge">1.3 beta</span>
        <nav class="navigation" aria-label="Primary navigation">
          <a href="{{ site.home_url }}">Home</a>
          <a href="{{ site.docs_url }}">Docs</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.section == 'blog' %}aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/news/' | relative_url }}" {% if page.section == 'news' %}aria-current="page"{% endif %}>News</a>
        </nav>
        <a class="console-link" href="{{ site.console_url }}">Open Console <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div>
          <strong>FedOps</strong>
          <p>Gachon University · Cognitive Computing Lab<br />Local intelligence. Shared progress.</p>
        </div>
        <nav aria-label="Footer navigation">
          <a href="{{ site.home_url }}">Home</a>
          <a href="{{ site.docs_url }}">Docs</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/news/' | relative_url }}">News</a>
        </nav>
      </div>
      <div class="wrap copyright">© 2026 Cognitive Computing Lab, Gachon University</div>
    </footer>
  </body>
</html>
